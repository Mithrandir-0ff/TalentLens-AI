services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: litellm

    volumes:
      - ./litellm_config.yaml:/app/config.yaml

    command:
      - "--config=/app/config.yaml"

    ports:
      - "4000:4000"

    environment:
      DATABASE_URL: postgresql://llmproxy:dbpassword9090@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: sk-master-1234

      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse:3000

      HAPPYHUB_API_KEY: ${HAPPYHUB_API_KEY}

    env_file:
      - .env

    depends_on:
      - db
      - langfuse

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  talentelens-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: talentelens-api
    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - ../.env
    environment:
      - HTTP_PROXY=http://squid:3128
      - HTTPS_PROXY=http://squid:3128
      - NO_PROXY=litellm,langfuse,db,redis,localhost,127.0.0.1
      - no_proxy=litellm,langfuse,db,redis,localhost,127.0.0.1
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - LITELLM_MASTER_KEY=sk-master-1234
    depends_on:
      - litellm
      - langfuse

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3001:8080"
    environment:
      - WEBUI_AUTH=False
      - HF_HUB_OFFLINE=1
      - OPENAI_API_BASE_URL=http://talentelens-api:8000/v1
      - OPENAI_API_KEY=dummy
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - talentelens-api

  db:
    image: postgres:16
    container_name: litellm_db
    restart: always

    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10

  langfuse-db:
    image: postgres:16
    container_name: langfuse_db
    restart: always

    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse

    ports:
      - "5434:5432"

    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server
    container_name: clickhouse
    restart: always

    ports:
      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse

    volumes:
      - clickhouse_data:/var/lib/clickhouse

  redis:
    image: redis:7
    container_name: redis
    restart: always

    ports:
      - "6379:6379"

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse
    restart: always

    depends_on:
      - langfuse-db
      - clickhouse
      - redis

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse

      NEXTAUTH_SECRET: supersecret
      SALT: supersalt

      NEXTAUTH_URL: http://localhost:3000

      TELEMETRY_ENABLED: "false"

      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"

      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000

      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse

      REDIS_HOST: redis
      REDIS_PORT: 6379

  squid:
    build:
      context: ../squid
    container_name: squid
    ports:
      - "3128:3128"

volumes:
  postgres_data:
    name: litellm_postgres_data

  langfuse_postgres_data:

  clickhouse_data:

  open-webui: